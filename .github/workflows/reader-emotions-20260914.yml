name: Reader emotions delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/reader-emotions-20260914.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: reader-site-main
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integrity-checked editable source patch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fdfd2213b3262f8365868945f3dfdce9dd29aa62 HEAD
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          shas = ['18e155f5b20fdc350d4f6d4f2992cf3775a4a18e','4a234e84f049118408a6be0bae5f87e17a036637','06ea9934623e475da31eb8bbf1d797eb9e06ce0f','a2317c3d55ec1a68d6f700f86065fd5b6581db21','c0a249a46f74f6509c7dbe2cdc1bebe32c30c9ce']
          chunks=[]
          for sha in shas:
              result=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["REPOSITORY"]}/git/blobs/{sha}']))
              assert result['encoding']=='base64'
              chunk=base64.b64decode(result['content'])
              actual=hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()
              assert actual==sha, (sha,actual)
              chunks.append(chunk)
          patch=lzma.decompress(b''.join(chunks))
          assert hashlib.sha256(patch).hexdigest()=='b8945321c1c5deaebc2cf5dfb32fe256d9deec4cace71652727f1eee6673413c'
          paths=[line[6:] for line in patch.decode('utf-8').splitlines() if line.startswith('+++ b/')]
          assert len(paths)==31
          assert all(not p.startswith(('/', '.github/')) and '..' not in pathlib.PurePosixPath(p).parts for p in paths)
          path=pathlib.Path('/tmp/reader-emotions.patch');path.write_bytes(patch)
          if subprocess.run(['git','apply','--check',str(path)],capture_output=True).returncode==0:
              subprocess.run(['git','apply',str(path)],check=True)
              print('Applied verified 31-file source patch without overwriting conflicts.')
          elif subprocess.run(['git','apply','--reverse','--check',str(path)],capture_output=True).returncode==0:
              print('Patch already applied; rebuilding and retesting current main.')
          else:
              subprocess.run(['git','apply','--check',str(path)],check=True)
          PY
      - name: Build and validate canonical data and reader pages
        run: |
          set -euo pipefail
          python scripts/register_reader_sources.py
          python scripts/build_research_views.py
          python scripts/reconcile_article_progress.py
          python scripts/build_reader_site.py
          python scripts/test_reader_site.py
          python scripts/validate.py
          python scripts/validate_research.py
          python scripts/validate_round3.py
          python scripts/validate_editorial_pass.py
          python scripts/reconcile_article_progress.py --check
      - name: Install browser testing dependencies
        run: |
          python -m pip install playwright==1.57.0 beautifulsoup4==4.14.3
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify real HTTP navigation and responsive reading
        run: |
          set -euo pipefail
          python scripts/test_reader_browser.py
          python scripts/test_reader_foundations.py
          python scripts/test_reader_learning.py
          python scripts/test_reader_emotions.py
      - name: Commit only validated source and generated pages
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add README.md data articles/reader scripts/*.py site docs index.html .nojekyll assets topics read about search learn glossary
            if ! git diff --cached --quiet; then
              git commit -m 'Add 12 emotion/dialogue editions, 12 terms and tested category navigation'
            fi
            git fetch origin main
            if git diff --quiet HEAD origin/main; then
              echo 'validated=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then
                echo 'validated=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'Concurrent source conflict; remote changes preserved, no force-push.' >&2
              exit 1
            fi
            python scripts/register_reader_sources.py
            python scripts/build_research_views.py
            python scripts/reconcile_article_progress.py
            python scripts/build_reader_site.py
            python scripts/test_reader_site.py
            python scripts/validate.py
            python scripts/validate_research.py
            python scripts/validate_round3.py
            python scripts/validate_editorial_pass.py
            python scripts/reconcile_article_progress.py --check
            python scripts/test_reader_browser.py
            python scripts/test_reader_foundations.py
            python scripts/test_reader_learning.py
            python scripts/test_reader_emotions.py
          done
          echo 'Main kept changing; no force-push performed.' >&2
          exit 1
      - name: Request Pages rebuild of validated main
        if: steps.commit.outputs.validated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --jq '{status, url}'
      - name: Prepare review snapshot
        if: always()
        run: |
          mkdir -p /tmp/psychology-emotions-review
          for item in .github data articles docs scripts site assets topics read about search learn glossary index.html README.md AGENTS.md DEVELOPMENT_POLICY.md .nojekyll research schemas review-screenshots; do
            if [ -e "$item" ]; then cp -R "$item" /tmp/psychology-emotions-review/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-emotions-review
          path: /tmp/psychology-emotions-review
          include-hidden-files: true
          retention-days: 7
