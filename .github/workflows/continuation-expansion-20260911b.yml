name: Deliver continuation expansion 20260911b
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/continuation-expansion-20260911b.yml'
      - 'scripts/build_expansion_20260911b.py'
      - 'scripts/repair_expansion_20260911b.py'
      - 'research/continuation_20260911b/**'
permissions:
  contents: write
concurrency:
  group: psychology-editorial-writing
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile the interrupted authoring batch
        run: |
          python3 scripts/repair_expansion_20260911b.py
          python3 scripts/build_expansion_20260911b.py
      - name: Check preservation and repeatability
        run: |
          python3 scripts/validate.py
          python3 scripts/validate_research.py
          python3 scripts/validate_round3.py
          python3 scripts/validate_editorial_pass.py
          python3 - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          m=Path('data/articles/batches/continuation-20260911b/manifest.json')
          report=json.loads(m.read_text())
          assert report['canonical_integration']['completed'],report['canonical_integration']
          before=Path('data/articles/progress.json').read_bytes()
          subprocess.run(['python3','scripts/build_expansion_20260911b.py'],check=True)
          assert before==Path('data/articles/progress.json').read_bytes(),'Non-idempotent progress'
          assert report['publication_ready_count']==0 and report['goal_completed'] is False
          for a in report['articles']:
              assert hashlib.sha256(Path(a['draft_path']).read_bytes()).hexdigest()==a['manuscript_sha256']
              assert hashlib.sha256(Path(a['claim_path']).read_bytes()).hexdigest()==a['claim_sha256']
          for name in ['data/sources.json','data/categories.json']+[str(p) for p in Path('data/topics').glob('*.json')]:
              assert subprocess.check_output(['git','show','HEAD:'+name])==Path(name).read_bytes(),name
          p=Path('README.md');text=p.read_text();import re
          progress=json.loads(before)
          text=re.sub(r'本文\d+件',f"本文{progress['manuscript_count']}件",text)
          text=re.sub(r'主張対応表\d+件',f"主張対応表{progress['claim_dossier_count']}件",text)
          link='[回収した12原稿と根拠表](docs/CONTINUATION_20260911B.md)'
          if link not in text:text+='\n'+link+'\n'
          p.write_text(text)
          print('PASS: 12 recovered manuscripts, unchanged source records, deterministic counts, no release inflation.')
          PY
      - name: Commit verified manuscripts to main
        run: |
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)" || { echo 'Concurrent update; refusing overwrite.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles data/articles docs/CONTINUATION_20260911B.md README.md scripts/build_expansion_20260911b.py research/continuation_20260911b
          if ! git diff --cached --quiet; then
            git commit -m 'editorial: recover 12 manuscripts and validate catalog integration'
            git push origin HEAD:main
          fi
      - name: Preserve completed and unfinished outputs
        if: always()
        run: |
          mkdir -p continuation-export
          git archive --format=zip --output=continuation-export/repository.zip HEAD
          git rev-parse HEAD > continuation-export/source_commit.txt
          git status --short > continuation-export/uncommitted_status.txt
          git diff > continuation-export/uncommitted.patch
          if [ -d articles ]; then cp -R articles continuation-export/working-articles; fi
          if [ -d data/articles ]; then cp -R data/articles continuation-export/working-article-data; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psychology-continuation-expansion-20260911b
          path: continuation-export/
          retention-days: 14
          if-no-files-found: error
