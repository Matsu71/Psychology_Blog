name: Final relevance audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-relevance.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove indirect associations without deleting the studies
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.materialize_research import generate_docs
          root = Path('.')
          def read(path):
              return json.loads((root/path).read_text())
          def write(path,obj):
              (root/path).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          removals = {
              'RB-39377163':['PSY-SLP-010'],
              'RB-26479070':['PSY-HAB-010'],
              'RB-34586357':['PSY-HPS-004'],
              'RB-30646029':['PSY-MON-006'],
              'RB-31197192':['PSY-CRE-004'],
              'RB-36044424':['PSY-WRK-009'],
              'RB-26502459':['PSY-WRK-009']
          }
          categories=read('data/categories.json')['categories']
          docs={c['file']:read(c['file']) for c in categories}
          topics={t['id']:t for d in docs.values() for t in d['topics']}
          original={t['id'] for c in categories[:20] for t in docs[c['file']]['topics']}
          briefdoc=read('data/research/briefs.json')
          for b in briefdoc['briefs']:
              b['topic_ids']=[tid for tid in b['topic_ids'] if tid not in removals.get(b['id'],[])]
          for t in topics.values():
              t['source_ids']=[sid for sid in t['source_ids'] if int(sid[3:])<=35]
              t.pop('research_brief_ids',None)
          for b in briefdoc['briefs']:
              for tid in b['topic_ids']:
                  t=topics[tid]
                  t.setdefault('research_brief_ids',[]).append(b['id'])
                  for sid in b['source_ids']:
                      if sid not in t['source_ids']:
                          t['source_ids'].append(sid)
          reviewed={t['id'] for t in topics.values() if t.get('research_brief_ids')}
          coverage=read('data/research/coverage.json')
          coverage.update(brief_linked_topic_count=len(reviewed),original_topics_with_new_briefs=len(reviewed&original),new_topics_with_briefs=len(reviewed-original),previously_unreferenced_original_topics_now_linked=sum(tid in original and bool(t['source_ids']) and not any(int(s[3:])<=35 for s in t['source_ids']) for tid,t in topics.items()),reference_linked_count=sum(bool(t['source_ids']) for t in topics.values()),search_pending_count=sum(not t['source_ids'] for t in topics.values()),relevance_links_removed_in_final_audit=sum(map(len,removals.values())))
          for c,p in zip(categories,coverage['categories']):
              rows=docs[c['file']]['topics']
              p.update(reference_linked_count=sum(bool(t['source_ids']) for t in rows),brief_linked_count=sum(t['id'] in reviewed for t in rows))
          manifest=read('data/manifest.json')
          for key in ['brief_linked_topic_count','reference_linked_count','search_pending_count']:
              manifest[key]=coverage[key]
          queue=read('data/research/next_queue.json')
          queue['topic_ids_without_briefs']=[tid for tid in topics if tid not in reviewed]
          for path,obj in docs.items():
              write(path,obj)
          write('data/research/briefs.json',briefdoc)
          write('data/research/coverage.json',coverage)
          write('data/manifest.json',manifest)
          write('data/research/next_queue.json',queue)
          write('data/research/relevance_audit.json',{'schema_version':'1.0','date':'2026-09-11','removed_links':removals,'reason_ja':'研究の対象とテーマの主たる問いが離れている紐付けを削除。カフェイン試験は機器の精度検証ではなく、進捗記録は事前コミットメントではなく、腰痛治療は動悸の研究ではない。緑化とうつは金銭不安と認知成績を直接扱わず、自然への接触量は畏敬そのものを測っていない。短い休憩や空気質の研究は会議の多さの比較ではない。資料と読解メモは保持し、これらの問いには別の研究が必要とした。'})
          generate_docs(categories,docs,read('data/sources.json')['sources'],briefdoc['briefs'],coverage)
          print({k:coverage[k] for k in ['brief_linked_topic_count','original_topics_with_new_briefs','new_topics_with_briefs','reference_linked_count','search_pending_count','relevance_links_removed_in_final_audit']})
          PY
      - name: Validate the audited database and export
        run: |
          python3 scripts/validate.py --export build
          python3 scripts/validate_research.py --export build
          cp data/research/relevance_audit.json build/relevance_audit.json
      - name: Commit the audited canonical data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs README.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: tighten theme-to-study relevance and refresh coverage counts'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > build/source_commit.txt
      - name: Save verified database after relevance audit
        uses: actions/upload-artifact@v4
        with:
          name: psychology-research-expanded-300-reviewed
          path: build/
          if-no-files-found: error
          retention-days: 14
