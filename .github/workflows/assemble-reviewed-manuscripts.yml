name: Assemble reviewed manuscripts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-reviewed-manuscripts.yml'
permissions:
  contents: write
concurrency:
  group: psychology-editorial-delivery
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Integrate the already selected source records
        run: |
          python3 scripts/upgrade_editorial_views.py
          python3 scripts/apply_editorial_delivery.py
      - name: Support exact registry URLs without guessing source identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/compile_claim_manuscripts.py')
          s=p.read_text(encoding='utf-8')
          old="            if not matches and sel.get('title'):\n"
          new="            if not matches and sel.get('url'):\n                matches.update(x['id'] for x in source_list if x.get('url','').rstrip('/') == sel['url'].rstrip('/'))\n                if matches: method = 'exact_identifier'\n            if not matches and sel.get('title'):\n"
          if new not in s:
              assert s.count(old)==1, 'Unexpected source compiler; reconcile first'
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile scripts/compile_claim_manuscripts.py
      - name: Compile preserved and revised manuscripts
        run: python3 scripts/compile_claim_manuscripts.py
      - name: Verify identities, claims and top 20 coverage
        run: |
          python3 scripts/validate.py
          python3 scripts/validate_research.py
          python3 scripts/validate_round3.py
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          def read(p):return json.loads(Path(p).read_text(encoding='utf-8'))
          progress=read('data/articles/progress.json')
          catalog=read('data/articles/catalog.json')['articles']
          assert len(catalog)==300 and len({a['topic_id'] for a in catalog})==300
          assert progress['publication_ready_count']==0 and progress['goal_completed'] is False
          assert progress['top20_dossiers_present']==20, progress['missing_top20_topic_ids']
          original_categories=json.loads(subprocess.check_output(['git','show','HEAD:data/categories.json'],text=True))['categories']
          for c in original_categories:
              before=json.loads(subprocess.check_output(['git','show','HEAD:'+c['file']],text=True))['topics']
              after=read(c['file'])['topics']
              assert [(t['id'],t['title_ja']) for t in before]==[(t['id'],t['title_ja']) for t in after]
              for left,right in zip(before,after):assert set(left['source_ids'])<=set(right['source_ids'])
          source_ids={s['id'] for s in read('data/sources.json')['sources']}
          for a in catalog:
              if not a['manuscript_path']:continue
              assert Path(a['manuscript_path']).exists()
              assert hashlib.sha256(Path(a['manuscript_path']).read_bytes()).hexdigest()==a['manuscript_sha256']
              d=read(a['claim_dossier_path'])
              assert d['topic_id']==a['topic_id'] and d['publication_ready'] is False
              for c in d['claims']:assert set(c['source_ids'])<=source_ids
          unresolved=sum(len(read(a['claim_dossier_path'])['unresolved_source_keys']) for a in catalog if a['claim_dossier_path'])
          report={'schema_version':'1.0','status':'structural_checks_passed','theme_count':300,'manuscripts':progress['manuscript_count'],'revised_manuscripts':progress['revised_manuscript_count'],'top20_dossiers':progress['top20_dossiers_present'],'claims_and_cautions':progress['claim_and_caution_count'],'unresolved_source_selectors':unresolved,'publication_ready_articles':0,'note_ja':'構造の検証と本文の科学的な主張の真偽は別です。出典の照合で科学的査読が完了したとは扱いません。'}
          Path('data/articles/validation_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Record exact current work and next actions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def r(p):return json.loads(Path(p).read_text(encoding='utf-8'))
          a=r('data/articles/progress.json'); c=r('data/research/coverage.json')
          original=r('research/round4_continuation_editorial_audit.json')
          audit=[]
          for item in original['checks']:
              status='open_recheck_revised_manuscripts'
              if item['id']=='R4-QA-018' and a['top20_dossiers_present']==20 and c['search_pending_count']==0:
                  status='registry_and_top20_alignment_resolved'
              audit.append({'audit_id':item['id'],'topic_ids':item['topic_ids'],'status':status,'original_finding_ja':item['finding_ja'],'remaining_check_ja':item['required_action_ja']})
          Path('data/articles/audit_status.json').write_text(json.dumps({'schema_version':'1.0','date':'2026-09-11','items':audit,'independent_scientific_review':False},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=['# 次に行う作業','','最終目標：科学的根拠と読みやすさを備えた300記事。途中の件数を完成目標に置き換えません。','',f"現在：300テーマ、出典{c['source_count']}件、出典未登録{c['search_pending_count']}テーマ。本文{a['manuscript_count']}件、根拠表{a['claim_dossier_count']}件。上位20テーマの根拠表{a['top20_dossiers_present']}/20。公開承認0件。",'', '## 直近の作業','','1. data/articles/progress.jsonの未解決出典を照合し、各根拠表の主張を原文の対応箇所で点検する。','2. data/articles/audit_status.jsonの未解決事項を、修正文・裏付け・残る限界を記録して一件ずつ解消する。','3. キャッシュレス・ながら食べ・通信遮断の原稿について、結果・分母・対照条件・訂正を確認して不足部分を補う。','4. 根拠を確認した非臨床記事から、読みやすさと出典を点検して完成判定へ進める。医療的な助言は別の安全性確認を要する。','5. 残るテーマも同じ工程を繰り返す。資料の登録やテンプレートの生成を記事の完成として数えない。','', '## 保存場所','','原稿：articles/manuscripts/。主張単位の根拠：data/articles/claims/。全300テーマの状態：data/articles/catalog.json。','', 'このファイルは作業指示と現在地であり、会話終了後の自動実行を約束するものではありません。']
          Path('docs/NEXT_STEPS.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          p=Path('README.md'); text=p.read_text(encoding='utf-8')
          marker='<!-- ARTICLE-PROGRESS-20260911 -->'
          if marker in text:text=text.split(marker)[0].rstrip()+'\n'
          text+='\n'+marker+'\n## 最新の記事制作状況\n\n'+f"原稿{a['manuscript_count']}件、うち今回の再編集{a['revised_manuscript_count']}件。上位20テーマの根拠表{a['top20_dossiers_present']}/20。公開承認済み0件。\n\n"+'[現在地と全300テーマの状態](docs/ARTICLE_PROGRESS.md) / [次の作業](docs/NEXT_STEPS.md)\n\n資料の登録・出典IDの照合と、科学的な主張の確認・記事の完成を区別しています。\n'
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit only data, documentation, scripts and manuscripts
        run: |
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)" || { echo 'Concurrent main update; refusing to overwrite it.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs articles scripts README.md
          if ! git diff --cached --quiet; then
            git commit -m 'editorial: persist revised manuscripts, all top-20 claim dossiers and honest 300-article progress'
            git push origin HEAD:main
          fi
      - name: Export committed and recoverable work
        if: always()
        run: |
          mkdir -p manuscript-export
          git rev-parse HEAD > manuscript-export/source_commit.txt
          git status --short > manuscript-export/uncommitted_status.txt
          git archive --format=zip --output=manuscript-export/repository.zip HEAD
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('manuscript-export/working-package.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root in ['data/articles','articles/manuscripts','research/manuscript_revision_20260911']:
                  for p in Path(root).rglob('*'):
                      if p.is_file():z.write(p,str(p))
              for p in map(Path,['docs/ARTICLE_PROGRESS.md','docs/NEXT_STEPS.md','data/research/editorial_delivery_report.json']):
                  if p.is_file():z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psychology-revised-manuscripts-verified
          path: manuscript-export/
          retention-days: 14
          if-no-files-found: error
