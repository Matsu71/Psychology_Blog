name: Reader site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reader-site.yml'
      - 'scripts/build_reader_site.py'
      - 'scripts/reader_foundations.py'
      - 'scripts/reader_learning.py'
      - 'scripts/reader_navigation.py'
      - 'scripts/reader_references.py'
      - 'scripts/test_reader_wellbeing.py'
      - 'scripts/test_reader_motivation.py'
      - 'scripts/validate.py'
      - 'scripts/test_reader_emotions.py'
      - 'scripts/test_reader_learning.py'
      - 'scripts/test_reader_foundations.py'
      - 'scripts/test_reader_site.py'
      - 'scripts/test_reader_browser.py'
      - 'scripts/register_reader_sources.py'
      - 'scripts/build_research_views.py'
      - 'scripts/reconcile_article_progress.py'
      - 'site/**'
      - 'articles/**'
      - 'data/**'
permissions:
  contents: write
  pages: write
concurrency:
  group: reader-site-main
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate source and reader pages
        run: |
          set -euo pipefail
          python scripts/register_reader_sources.py
          python scripts/build_research_views.py
          python scripts/reconcile_article_progress.py
          python scripts/build_reader_site.py
          python scripts/test_reader_site.py
          python scripts/validate.py
          python scripts/validate_research.py
          python scripts/validate_round3.py
          python scripts/validate_editorial_pass.py
          python scripts/reconcile_article_progress.py --check
      - name: Install browser testing dependencies
        run: |
          python -m pip install playwright==1.57.0 beautifulsoup4==4.14.3
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test responsive reading and search
        run: |
          set -euo pipefail
          python scripts/test_reader_browser.py
          python scripts/test_reader_foundations.py
          python scripts/test_reader_learning.py
          python scripts/test_reader_emotions.py
          python scripts/test_reader_wellbeing.py
          python scripts/test_reader_motivation.py
      - name: Commit validated editable source and generated pages
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add AGENTS.md README.md data articles/reader scripts/*.py site docs index.html .nojekyll assets topics read about search learn glossary
            git add -u
            if ! git diff --cached --quiet; then
              git commit -m 'Build validated psychology reader site'
            fi
            git fetch origin main
            if git diff --quiet HEAD origin/main; then
              echo 'Remote tree already matches the tested tree; no duplicate commit.'
              echo 'validated=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then
                echo 'validated=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # A concurrent push may have arrived after fetch. Read the new main.
              continue
            fi
            # Preserve concurrent work. Genuine conflicts stop; never force-push.
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'Concurrent source conflict; manual reconciliation required.' >&2
              exit 1
            fi
            # A merged tree is not automatically a tested tree: regenerate and retest.
            python scripts/register_reader_sources.py
            python scripts/build_research_views.py
            python scripts/reconcile_article_progress.py
            python scripts/build_reader_site.py
            python scripts/test_reader_site.py
            python scripts/validate.py
            python scripts/validate_research.py
            python scripts/validate_round3.py
            python scripts/validate_editorial_pass.py
            python scripts/reconcile_article_progress.py --check
            python scripts/test_reader_browser.py
            python scripts/test_reader_foundations.py
            python scripts/test_reader_learning.py
            python scripts/test_reader_emotions.py
            python scripts/test_reader_wellbeing.py
            python scripts/test_reader_motivation.py
          done
          echo 'Main kept changing during safe publication; no force-push performed.' >&2
          exit 1
      - name: Request Pages rebuild from validated main
        if: steps.commit.outputs.validated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --jq '{status, url}'
      - name: Prepare review snapshot
        if: always()
        run: |
          mkdir -p /tmp/psychology-review
          for item in .github data articles docs scripts site assets topics read about search learn glossary index.html README.md AGENTS.md DEVELOPMENT_POLICY.md .nojekyll research schemas review-screenshots; do
            if [ -e "$item" ]; then cp -R "$item" /tmp/psychology-review/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-site-review
          path: /tmp/psychology-review
          include-hidden-files: true
          retention-days: 7
