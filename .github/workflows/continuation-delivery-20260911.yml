name: Validate continuation manuscripts

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/continuation_delivery_20260911/articles_*.json'
      - 'scripts/build_continuation_delivery_20260911.py'
      - '.github/workflows/continuation-delivery-20260911.yml'

permissions:
  contents: write

concurrency:
  group: psychology-continuation-delivery-20260911
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check authored prose, source selectors, claim scopes and protected data
        run: |
          python3 scripts/build_continuation_delivery_20260911.py
          python3 scripts/validate.py
          python3 scripts/validate_research.py
          python3 scripts/validate_round3.py
      - name: Confirm deterministic rendering
        run: |
          python3 - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          paths=list(Path('articles/continuation_20260911').glob('*.md'))
          paths+=list(Path('data/articles/continuation_20260911').rglob('*.json'))
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          subprocess.run(['python3','scripts/build_continuation_delivery_20260911.py'],check=True)
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in before.items())
          print('PASS: deterministic output. This is not a scientific or publication approval.')
          PY
      - name: Commit verified generated manuscripts without overwriting concurrent edits
        run: |
          original=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$original" = "$remote" || { echo 'Concurrent main change; preserve output for reconciliation.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/continuation_20260911 data/articles/continuation_20260911 docs/CONTINUATION_DELIVERY.md
          if ! git diff --cached --quiet; then
            git commit -m 'editorial: persist ten continuation manuscripts and scoped claim dossiers'
            git push origin HEAD:main
          fi
      - name: Export a recoverable snapshot and any uncommitted output
        if: always()
        run: |
          mkdir -p continuation-export
          git archive --format=zip --output=continuation-export/repository.zip HEAD
          git rev-parse HEAD > continuation-export/source_commit.txt
          git status --short > continuation-export/uncommitted_status.txt
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('continuation-export')
          for src,dst in [('articles/continuation_20260911','manuscripts'),('data/articles/continuation_20260911','dossiers')]:
              if Path(src).is_dir():shutil.copytree(src,out/dst,dirs_exist_ok=True)
          p=Path('docs/CONTINUATION_DELIVERY.md')
          if p.is_file():shutil.copyfile(p,out/p.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psychology-continuation-delivery-20260911
          path: continuation-export/
          if-no-files-found: error
          retention-days: 14
