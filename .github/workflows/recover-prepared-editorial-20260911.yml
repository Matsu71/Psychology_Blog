name: Complete saved editorial work
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-prepared-editorial-20260911.yml'
      - 'scripts/complete_pending_work_20260911.py'
permissions:
  contents: write
concurrency:
  group: psychology-editorial-writing
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Integrate saved content and run all seven validation checks
        run: python3 scripts/complete_pending_work_20260911.py
      - name: Commit validated manuscripts and verify remote main
        run: |
          current=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$remote" || { echo 'Concurrent main update. No overwrite.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles data docs README.md scripts/validate_round3.py
          if ! git diff --cached --quiet; then
            git commit -m 'editorial: integrate 12 saved manuscripts, preserve prior work and verify all references'
            git push origin HEAD:main
          fi
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          mkdir -p completed-work-export
          git rev-parse HEAD > completed-work-export/pushed_commit.txt
          git fetch --depth=1 origin main
          git show origin/main:data/research/push_reconciliation_20260911.json > completed-work-export/remote_report.json
          cmp data/research/push_reconciliation_20260911.json completed-work-export/remote_report.json
          git show origin/main:data/articles/progress.json > completed-work-export/remote_progress.json
          cmp data/articles/progress.json completed-work-export/remote_progress.json
      - name: Export tracked snapshot and diagnostics
        if: always()
        run: |
          mkdir -p completed-work-export
          git archive --format=zip --output=completed-work-export/repository.zip HEAD
          git rev-parse HEAD > completed-work-export/checkout_commit.txt
          git status --short > completed-work-export/uncommitted_status.txt
          git diff > completed-work-export/uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psychology-completed-work-main
          path: completed-work-export/
          retention-days: 14
          if-no-files-found: error
