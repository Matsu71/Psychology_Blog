name: Reader foundations delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/reader-foundations-20260914.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: reader-site-main
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          shas = ['ee9c3ff1d3eae6211993579dc9cee759b6dda7eb', '02b2b9069b87b4c859c2b0229a2b0d69c497deb7', 'b2d959e692e3ac45c4fcbc3ca0e2e5bf0b23f741', '4560b65d25098a21654df16794a6edf21e2aff5e']
          chunks = []
          for sha in shas:
              result = json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["REPOSITORY"]}/git/blobs/{sha}']))
              assert result['encoding'] == 'base64'
              chunk = base64.b64decode(result['content'])
              actual = hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()
              assert actual == sha, (sha, actual)
              chunks.append(chunk)
          patch = lzma.decompress(b''.join(chunks))
          expected = 'b7fe11915d86ef8803c0acd56c75281c4511dff7d7d2d2ff69bbabffa9abf8fd'
          assert hashlib.sha256(patch).hexdigest() == expected
          path = pathlib.Path('/tmp/reader-foundations.patch')
          path.write_bytes(patch)
          # The delivery contains only editable UTF-8 source files, never workflow changes.
          paths = [line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')]
          assert len(paths) == 26 and not any(p.startswith('.github/') for p in paths)
          if subprocess.run(['git','apply','--check',str(path)],capture_output=True).returncode == 0:
              subprocess.run(['git','apply',str(path)],check=True)
              print('Applied verified 26-file patch to current main without overwriting conflicts.')
          elif subprocess.run(['git','apply','--reverse','--check',str(path)],capture_output=True).returncode == 0:
              print('Patch is already applied; rebuilding and revalidating current main.')
          else:
              subprocess.run(['git','apply','--check',str(path)],check=True)
          PY
      - name: Build and validate data and all reader pages
        run: |
          set -euo pipefail
          python scripts/register_reader_sources.py
          python scripts/build_research_views.py
          python scripts/reconcile_article_progress.py
          python scripts/build_reader_site.py
          python scripts/test_reader_site.py
          python scripts/validate.py
          python scripts/validate_research.py
          python scripts/validate_round3.py
          python scripts/validate_editorial_pass.py
          python scripts/reconcile_article_progress.py --check
      - name: Install browser testing dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify reading, search, glossary, and real page navigation
        run: |
          set -euo pipefail
          python scripts/test_reader_browser.py
          python scripts/test_reader_foundations.py
      - name: Commit only validated source and generated pages
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add README.md data articles/reader scripts/*.py site docs index.html .nojekyll assets topics read about search learn glossary
            if ! git diff --cached --quiet; then
              git commit -m 'Add validated learning guides, 24 research terms, and 12 reader editions'
            fi
            git fetch origin main
            if git diff --quiet HEAD origin/main; then
              echo 'validated=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then
                echo 'validated=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'Concurrent source conflict; preserved remote changes, no force-push.' >&2
              exit 1
            fi
            python scripts/register_reader_sources.py
            python scripts/build_research_views.py
            python scripts/reconcile_article_progress.py
            python scripts/build_reader_site.py
            python scripts/test_reader_site.py
            python scripts/validate.py
            python scripts/validate_research.py
            python scripts/validate_round3.py
            python scripts/validate_editorial_pass.py
            python scripts/reconcile_article_progress.py --check
            python scripts/test_reader_browser.py
            python scripts/test_reader_foundations.py
          done
          echo 'Main continued changing; no force-push performed.' >&2
          exit 1
      - name: Request Pages rebuild of validated main
        if: steps.commit.outputs.validated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --jq '{status, url}'
      - name: Prepare review snapshot
        if: always()
        run: |
          mkdir -p /tmp/psychology-foundations-review
          for item in .github data articles docs scripts site assets topics read about search learn glossary index.html README.md AGENTS.md DEVELOPMENT_POLICY.md .nojekyll research schemas review-screenshots; do
            if [ -e "$item" ]; then cp -R "$item" /tmp/psychology-foundations-review/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-foundations-review
          path: /tmp/psychology-foundations-review
          include-hidden-files: true
          retention-days: 7
